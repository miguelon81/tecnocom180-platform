services:
  api:
    image: tecnocom180-api:test
    container_name: tecnocom180-api-compose-test
    restart: "no"

    ports:
      - "127.0.0.1:3001:3000"

    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL de pruebas requerida}
      API_HOST: "0.0.0.0"
      TELEGRAM_NOTIFICATIONS_ENABLED: "false"
      MQTT_ENABLED: "false"

    stop_grace_period: 35s
